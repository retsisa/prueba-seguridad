<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Bienvenida</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1e3a5f, #0f1f33);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 14px;
      box-shadow: 0 20px 45px rgba(0,0,0,.35);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .card h1 { color: #166534; font-size: 1.3rem; margin-bottom: .5rem; }
    .card p { color: #334155; font-size: .95rem; }
    .badge {
      display: inline-block;
      margin-top: 1rem;
      padding: .4rem .9rem;
      background: #dcfce7;
      color: #166534;
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>¡Bienvenido!</h1>
    <p>Has iniciado sesión correctamente como:</p>
    <div class="badge">{{ usuario }}</div>
  </div>
</body>
</html>
